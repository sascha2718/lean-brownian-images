version: "v0.4"
project:
  name: "Correlation integrals and Minkowski reconstruction of planar Brownian images"
  description: "Lean formalisation of distinguishing planar Brownian images through their correlation profiles and reconstructing occupation measures from compact images. The results separate lattice from non-lattice natural measures and sets, give finitely many possible exceptions in a two-contraction family, and remove all exceptions for sufficiently small dimension."
  authors: ["Sascha Troscheit"]
  license: "Apache-2.0"
  responsible_maintainers: ["Sascha Troscheit"]
classification:
