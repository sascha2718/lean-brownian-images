    authors: ["Sascha Troscheit"]
    type: "paper"
    location: "BrownianImagesComplete.tex, Section 1 and supporting Sections 2–9"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: "The manuscript is in the parent research directory. paper-correspondence.yaml records statement mappings and source fingerprints. No arXiv identifier has been supplied."
