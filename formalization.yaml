    note: "Six renewal-theory modules are vendored from commit 41c45c6d72e979419e46224bb7b4be5cee31f2b5. The non-lattice hypothesis is weakened to the Feller condition used by the proofs; see NOTICE and docs/renewal-library.md."
status:
  scope: "All nine numbered results of Section 1 are independent Challenge endpoints with proofs in Solution. The wider Solution contains 136 audit declarations. No literature theorem is assumed as an axiom or as a hypothesis of these nine endpoints. The general level-sum lemma is proved for arbitrary holomorphic kernels, with uniform convergence, its exact bound and the natural-measure expectation identity. The explicit lattice periodisation formula in the renewal proof is not separately formalised. The introductory discussion of correlation dimension and local densities, and the comparisons with dynamical reconstruction and hitting-time statistics, are background outside the formalisation. Counts exclude the nine intentional Challenge theorem holes."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
