fidelity:
  divergences: "The Challenge defines the expected profile by Brownian expectation and the two-contraction attractor and natural measure by their invariance equations. The solution proves that these choices are the library's objects and that their Cesàro means exist. Monotonicity between critical points is stated on each open interval without a critical point. Compact sets use the Hausdorff hyperspace, and the triangular cut-off measures use its Borel structure. The internal time-correlation integral uses a closed inequality, equivalent to the manuscript's strict inequality by atomlessness. Lean uses dyadic summation for the four-point bound and the sufficient numerical bound 0.754<0.88 instead of the manuscript's 0.62 in the small-parameter argument. Supporting-result qualifications are recorded in paper-correspondence.yaml and docs/correspondence.md."
review:
  status: "agent-reviewed"
  reviewers: ["Codex (OpenAI, GPT-6 agent)"]
  notes: "The nine Section 1 statements were compared with the manuscript. On 2026-10-14, manuscript changes from 93b440f to 3b40222 were reviewed: all 32 numbered statements and the proofs were unchanged, while new introductory background is explicitly excluded in paper-correspondence.yaml. The wider mapping incorporates the existing correspondence notes and their qualifications. This records agent review, not independent human review or Palomar acceptance. Mechanical verification of an uploaded commit is a separate Palomar run."
alignment:
  namespace: "BrownianImages"
  statements:
    - source: "Separation by expected profiles"
      lean: "BrownianImages.audit_main"
      module: "Challenge"
      status: "proved"
      note: "Separated expected correlation profiles give singular occupation laws."
    - source: "Lattice and non-lattice profile asymptotics"
      lean: "BrownianImages.audit_profile_asymptotics"
      module: "Challenge"
      status: "proved"
      note: "The expected Brownian profile has a positive nonconstant periodic limit in the lattice case and a positive constant limit in the non-lattice case."
    - source: "Lattice/non-lattice occupation-law separation"
      lean: "BrownianImages.audit_lattice_nonlattice_measures"
      module: "Challenge"
      status: "proved"
      note: "Arbitrary lattice and non-lattice natural measures of a common dimension under the open set condition have singular occupation laws."
    - source: "Finite exceptions in the two-contraction family"
      lean: "BrownianImages.audit_finite_exceptions"
      module: "Challenge"
      status: "proved"
      note: "The mean is the limit of the expected-profile averages, whose convergence is proved. Its level sets on (0,1/2] are finite. Distinct means give singular occupation laws. The critical set has no accumulation in (0,1/2], and the mean is strictly monotone on every open interval without critical points, hence on every component of the complement."
    - source: "Small-dimension monotonicity"
      lean: "BrownianImages.audit_small_dimension"
      module: "Challenge"
      status: "proved"
      note: "For a sufficiently small positive dimension threshold, the mean is strictly increasing on (0,1/2] and every distinct pair gives singular occupation laws."
    - source: "Finiteness of the critical set"
      lean: "BrownianImages.audit_finite_critical_set"
      module: "Challenge"
      status: "proved"
      note: "For each 0<s<=1/2 the mean is strictly increasing near p=0 and the critical set is finite."
    - source: "Minkowski reconstruction"
      lean: "BrownianImages.audit_reconstruction"
      module: "Challenge"
      status: "proved"
      note: "Normalised triangular cut-off measures at radii exp(-n) converge weakly almost surely to the occupation measure, which is a Borel function of the compact image."
    - source: "Lattice/non-lattice compact-image separation"
      lean: "BrownianImages.audit_lattice_nonlattice_sets"
      module: "Challenge"
      status: "proved"
      note: "Arbitrary lattice and non-lattice attractors of a common dimension under the open set condition have singular compact-image laws. Natural measures are constructed inside the proof."
    - source: "Two-contraction compact-image separation"
      lean: "BrownianImages.audit_two_contraction_sets"
      module: "Challenge"
      status: "proved"
      note: "Distinct means give singular compact-image laws, with at most finitely many exceptions for each fixed parameter. A single small-dimension threshold gives both strict increase of the mean and separation of every distinct pair, so it also serves Theorem 1.5."
acknowledgements: "Lean 4, Mathlib, Comparator, and Benny Avelin's vendored renewal development, whose licence and modifications are recorded in NOTICE."
