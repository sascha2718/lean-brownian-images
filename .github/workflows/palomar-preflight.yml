name: Palomar preflight

# Runs Palomar's own mechanical verifier on the current commit: metadata and layout checks,
# the challenge dependency audit, and the toolchain's `lake comparator` with replay through
# Lean's kernel and the kernels Palomar registers. This is a predictive preflight, not a
# registry submission. The pipeline is pinned to a full PalomarSubmission commit, and
# palomar-standard-v1 selects a GitHub-hosted runner rather than the catalogue default.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@1703d7babd984ccc3831cdf89c28221abe34808f
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 1703d7babd984ccc3831cdf89c28221abe34808f
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-config.json","authorization_relationship":"I am a responsible author or maintainer"}'
