    status: "formalized"
    lean: ["BrownianImages.audit_small_dimension"]
    relation: "representation"
    headline: true
    note: "For a sufficiently small positive dimension threshold, the mean is strictly increasing on (0,1/2] and every distinct pair gives singular occupation laws."
  - source: "Finiteness of the critical set"
