  - source: "Finite exceptions in the two-contraction family"
    label: "thm:fixed-dimension-separation"
    kind: "theorem"
    sha256: "6be8a1ad0b8e836f17696c39386c03e77191a43306945d34f169beaa68907938"
    status: "formalized"
    lean: ["BrownianImages.audit_finite_exceptions"]
    relation: "representation"
    headline: true
    note: "The mean is the limit of the expected-profile averages, whose convergence is proved. Its level sets on (0,1/2] are finite. Distinct means give singular occupation laws. The critical set has no accumulation in (0,1/2], and the mean is strictly monotone on every open interval without critical points, hence on every component of the complement."
  - source: "Small-dimension monotonicity"
    label: "thm:small-dimension-monotone"
