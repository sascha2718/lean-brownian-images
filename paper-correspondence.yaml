  - source: "Key renewal theorem quoted in Renewal and asymptotics"
    kind: "prose"
    file: "BrownianImagesComplete.tex"
    start: "We use the following form of the key renewal theorem, see"
    end: "In particular, $f(t)-\\widetilde f(t)\\to0$ as $t\\to\\infty$."
    sha256: "49af3e44172e7f44b86a844ef63667bcafc3ab6de31bd1200d7ab3925851e062"
    status: "partially_formalized"
    lean: ["BrownianImages.audit_key_renewal_theorem", "BrownianImages.audit_renewal_theorem_nonlattice", "BrownianImages.audit_renewal_theorem_lattice", "BrownianImages.audit_renewal_series"]
    relation: "weaker"
    headline: false
    reason: "Proved for the laws of self-similar systems at their similarity dimension, the generality in which the paper applies the theorem, not for an arbitrary finitely supported law on the positive half-line, and with a possibly signed exponentially decaying defect. The non-lattice limit, the lattice uniform convergence on one period to the explicit periodisation, and the renewal series in the non-lattice case are proved. The renewal series in the lattice case and the uniform continuity of the solution are not formalised; Lean obtains the uniform lattice convergence from Tannery's theorem instead."
    note: "Literature background from Falconer (1997) and Feller (1971), not a numbered statement of the paper. The lattice case applies the signed arithmetic renewal theorem to the cut-off solution and identifies its limit with the periodisation by telescoping the renewal equation along the lattice."
  - source: "Renewal shift limit"
    kind: "prose"
    file: "BrownianImagesComplete.tex"
    start: "We shall also use the following consequence for a bounded continuous function"
    end: "gives the same conclusion since $u\\in \\ell\\bbZ$."
    sha256: "0c7546520b08e95b45f71c9bc45f1c34fe3b72fc3832b2038d2c11c0d6814520"
    status: "partially_formalized"
    lean: ["BrownianImages.audit_renewal_shift"]
    relation: "weaker"
    headline: false
    reason: "The paper's shift consequence inherits the arbitrary finitely supported positive interarrival law of the preceding renewal theorem. Lean proves it for System.renewalLaw at the similarity dimension, whose weights and shifts satisfy p_i = exp(-s * alpha_i), rather than for independent choices of atom locations and probabilities. This covers the self-similar applications but not the full quoted generality."
    note: "For the laws of self-similar systems at their similarity dimension, with the atoms of the law as the shifts. Lean follows the paper's cut-off argument and applies the two cases of the key renewal theorem."
