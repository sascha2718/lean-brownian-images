    headline: false
    note: "Non-constancy of the explicit periodisation System.latticePeriodisation. The paper compares two phases directly. Lean argues by contradiction: a constant periodisation makes G converge, convergence gives a cross-term Lipschitz bound through the telescoped partial sums, and that bound contradicts Ahlfors regularity for s<1 (System.IsNatural.not_tendsto_G_of_lattice)."
