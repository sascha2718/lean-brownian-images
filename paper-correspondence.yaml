    note: "The non-lattice limit with its integral formula, and in the lattice case continuity, strict positivity, periodicity and the asymptotic approximation for the explicit periodisation (ell/m) times the sum of z(t+k*ell) over integers k, represented by System.latticePeriodisation with its series proved convergent. Lean obtains the periodic limit from the finite-delay renewal theorem (System.lattice_G_limit) and identifies it with this sum by telescoping the renewal equation along the lattice."
